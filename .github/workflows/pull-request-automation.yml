name: Promotion PRs (development/pre-production)

on:
  push:
    branches:
      - development
      - pre-production

jobs:
  manage-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout (full history for cross-branch diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # 1) Decide source/target/title (store in env)
      - name: Set PR variables
        run: |
          DATE=$(date +'%Y.%m')
          if [[ "${GITHUB_REF_NAME}" == "development" ]]; then
            echo "HEAD_BRANCH=development" >> $GITHUB_ENV
            echo "BASE_BRANCH=pre-production" >> $GITHUB_ENV
            echo "PR_TITLE=Development -> Pre-Production [$DATE]" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "pre-production" ]]; then
            echo "HEAD_BRANCH=pre-production" >> $GITHUB_ENV
            echo "BASE_BRANCH=production" >> $GITHUB_ENV
            echo "PR_TITLE=Pre-Production -> Production [$DATE]" >> $GITHUB_ENV
          else
            echo "Unsupported source branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Compute counter and title (simple)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          YEAR=2025  # change to YEAR=$(date +'%Y') if you want it dynamic

          # Direction + mirror setup
          if [[ "${HEAD_BRANCH}" == "development" ]]; then
            TITLE_PREFIX="Development -> Pre-Production"
            MIRROR_BASE="production"
            MIRROR_HEAD="pre-production"
          elif [[ "${HEAD_BRANCH}" == "pre-production" ]]; then
            TITLE_PREFIX="Pre-Production -> Production"
            MIRROR_BASE="pre-production"
            MIRROR_HEAD="development"
          else
            echo "Unsupported HEAD_BRANCH=${HEAD_BRANCH}" >&2
            exit 1
          fi

          # 1) If a mirror PR is open, reuse its XX
          mirror_title="$(gh pr list --base "$MIRROR_BASE" --head "$MIRROR_HEAD" --state open --json title -q '.[0].title' || true)"
          if [[ -n "$mirror_title" ]]; then
            if [[ "$mirror_title" =~ \[(${YEAR})\.([0-9]{2})\] ]]; then
              XX="${BASH_REMATCH[2]}"
              echo "Using mirror XX=${XX} from open PR: $mirror_title"
              echo "PR_TITLE=${TITLE_PREFIX} [${YEAR}.${XX}]" >> $GITHUB_ENV
              exit 0
            fi
          fi

          # 2) Otherwise, find the latest promotion PR this year and increment its XX
          #    We search PRs in this repo with titles containing [YEAR.??], newest first.
          latest_title="$(
            gh search prs \
              --repo "$GITHUB_REPOSITORY" \
              --match title \
              --json title \
              --limit 1 \
              --sort created \
              --order desc \
              --jq '.[0].title // empty' \
              -- "[${YEAR}.*]"
            || true
          )"

          if [[ -n "$latest_title" && "$latest_title" =~ \[(${YEAR})\.([0-9]{2})\] ]]; then
            last=$((10#${BASH_REMATCH[2]}))
            next=$((last + 1))
            printf -v XX "%02d" "$next"
          else
            XX="01"
          fi

          echo "PR_TITLE=${TITLE_PREFIX} [${YEAR}.${XX}]" >> $GITHUB_ENV


      - name: Fetch both branches
        run: |
          git fetch --prune origin
          # Make sure both refs exist locally
          git show-ref --verify --quiet "refs/remotes/origin/${HEAD_BRANCH}" || (echo "Missing origin/${HEAD_BRANCH}" && exit 1)
          git show-ref --verify --quiet "refs/remotes/origin/${BASE_BRANCH}" || (echo "Missing origin/${BASE_BRANCH}" && exit 1)

      # 2) Compute changed files: everything ahead on HEAD_BRANCH vs BASE_BRANCH
      - name: Get changed files (target...source)
        id: changed
        run: |
          git diff --name-only "origin/${BASE_BRANCH}"..."origin/${HEAD_BRANCH}" > changed_files.txt || true
          echo "count=$(wc -l < changed_files.txt | tr -d ' ')" >> $GITHUB_OUTPUT
          echo "files<<EOF" >> $GITHUB_OUTPUT
          cat changed_files.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "DEBUG changed files:"; cat changed_files.txt || true

      # 3) Exit early if no diff (prevents “no differences” confusion)
      - name: Skip if no differences
        if: ${{ steps.changed.outputs.count == '0' }}
        run: |
          echo "No differences between origin/${BASE_BRANCH} and origin/${HEAD_BRANCH}. Nothing to PR."
          exit 0

      # 4) Build body with “latest commit message per file”
            # 4) Build body grouped by latest commit message per file
      - name: Generate PR body (group by commit message, with subsections)
        id: body
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .grp_msgs .grp_files
          ORDER=()

          # Group files by their latest commit subject
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            msg=$(git log -1 --pretty=format:%s -- "$f" 2>/dev/null || echo "")
            [[ -z "$msg" ]] && msg="(no commit message)"
            key=$(printf "%s" "$msg" | sha1sum | awk '{print $1}')

            if [[ ! -f ".grp_msgs/$key.txt" ]]; then
              printf "%s" "$msg" > ".grp_msgs/$key.txt"
              ORDER+=("$key")
            fi
            printf "%s\n" "$f" >> ".grp_files/$key.txt"
          done < changed_files.txt

          BODY=""

          for key in "${ORDER[@]}"; do
            msg=$(cat ".grp_msgs/$key.txt")
            BODY+=$'\n## '"${msg}"$'\n'

            # Deduplicate while preserving order
            deduped=$(awk '!seen[$0]++' ".grp_files/$key.txt" || true)

            # Buckets
            automations=()
            playbooks=()
            other=()

            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              base="$(basename "$file")"
              if [[ "$base" == automation* ]]; then
                automations+=("$file")
              elif [[ "$base" == playbook* ]]; then
                playbooks+=("$file")
              else
                other+=("$file")
              fi
            done <<< "$deduped"

            # Emit subsections only if they have entries
            if (( ${#automations[@]} )); then
              BODY+=$'\nAutomations:\n'
              for f in "${automations[@]}"; do
                BODY+=$'- '"${f}"$'\n'
              done
            fi

            if (( ${#playbooks[@]} )); then
              BODY+=$'\nPlaybooks:\n'
              for f in "${playbooks[@]}"; do
                BODY+=$'- '"${f}"$'\n'
              done
            fi

            if (( ${#other[@]} )); then
              BODY+=$'\nOther:\n'
              for f in "${other[@]}"; do
                BODY+=$'- '"${f}"$'\n'
              done
            fi

            # Separator with TWO newlines after it
            BODY+=$'\n---\n\n'
          done

          # Remove trailing separator block if present (the final '---' and following blank lines)
          BODY="$(printf '%s' "$BODY" | sed -E ':a;N;$!ba;s/\n---\n\n$//')"

          echo "text<<EOF" >> $GITHUB_OUTPUT
          printf "%s\n" "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 5) Create or update PR using gh (real branch→branch PRs)
      - name: Find existing PR (HEAD -> BASE)
        id: find_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs=$(gh pr list --base "${BASE_BRANCH}" --head "${HEAD_BRANCH}" --state open --json number,title)
          if [ "$(echo "$prs" | jq 'length')" -gt 0 ]; then
            echo "number=$(echo "$prs" | jq -r '.[0].number')" >> $GITHUB_OUTPUT
          fi

      - name: Create PR if missing
        if: ${{ steps.find_pr.outputs.number == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${HEAD_BRANCH}" \
            --title "${PR_TITLE}" \
            --body  "${{ steps.body.outputs.text }}"

      - name: Update existing PR (title + overwrite body)
        if: ${{ steps.find_pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ steps.find_pr.outputs.number }}" \
            --title "${PR_TITLE}" \
            --body  "${{ steps.body.outputs.text }}"
