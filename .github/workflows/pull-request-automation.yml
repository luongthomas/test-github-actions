      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to diff across branches

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # 1) Decide source/target/title
      - name: Set branch variables
        id: vars
        run: |
          SOURCE_BRANCH="${GITHUB_REF_NAME}"
          YEAR=$(date +'%Y')
          MONTH=$(date +'%m')   # yields 2025.08 etc

          if [ "$SOURCE_BRANCH" = "development" ]; then
            TARGET_BRANCH="pre-production"
            TITLE="Development -> Pre-Production [${YEAR}.${MONTH}]"
          elif [ "$SOURCE_BRANCH" = "pre-production" ]; then
            TARGET_BRANCH="production"
            TITLE="Pre-Production -> Production [${YEAR}.${MONTH}]"
          else
            echo "Unsupported branch: $SOURCE_BRANCH"
            exit 1
          fi

          echo "source=$SOURCE_BRANCH" >> $GITHUB_OUTPUT
          echo "target=$TARGET_BRANCH" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      # 2) Find existing PR source -> target
      - name: Find existing PR
        id: find_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs_json=$(gh pr list \
            --base "${{ steps.vars.outputs.target }}" \
            --head "${{ steps.vars.outputs.source }}" \
            --state open --json number)
          if [ "$(echo "$prs_json" | jq 'length')" -gt 0 ]; then
            pr_number=$(echo "$prs_json" | jq -r '.[0].number')
            echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
          fi

      # 3) Compute changed files between branches (triple-dot = what's ahead on source)
      # - name: Get changed files between branches
      #   run: |
      #     git fetch origin "${{ steps.vars.outputs.target }}:${{ steps.vars.outputs.target }}" || true
      #     git fetch origin "${{ steps.vars.outputs.source }}:${{ steps.vars.outputs.source }}" || true
      #     git diff --name-only "origin/${{ steps.vars.outputs.target }}"..."origin/${{ steps.vars.outputs.source }}" > changed_files.txt || true
      #     cat changed_files.txt || true

      # test stackoverflow flow
      - uses: actions/checkout@v3
        with:
            fetch-depth: ${{ github.event_name == 'pull_request' && 1 }}
      - name: Get changed files
        id: changed-files
        run: |
            if ${{ github.event_name == 'pull_request' }}; then
                echo "changed_files=$(git diff --name-only -r HEAD^1 HEAD | xargs)" >> $GITHUB_OUTPUT
            else
                echo "changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | xargs)" >> $GITHUB_OUTPUT
            fi
      # above will always run the ELSE statement because we're not triggering the workflow with a PULL REQUEST
      # it is doing a git diff between event.before and event.after

      # This one seems to work
      - name: List changed files
        run: |
            for file in ${{ steps.changed-files.outputs.changed_files }}; do
                echo "$file was changed"
            done

      - name: List changed files with commit message
        run: |
          for file in ${{ steps.changed-files.outputs.changed_files }}; do
            # Get latest commit message for this file
            message=$(git log -1 --pretty=format:"%s" -- "$file")
            echo "$file — $message"
          done


      # Get changed files alternative
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: (CI) Dependencies update check
        run: |
          current_commit=`git log -n 1 --pretty=format:%H`
          echo $current_commit
          last_deps_mod_commit=`git log -n 1 --pretty=format:%H -- composer.json`
          echo $last_deps_mod_commit
          if [ $current_commit == $last_deps_mod_commit ]; then echo USE_LOCK=0 > ci.conf; else echo USE_LOCK=1 > ci.conf; fi


      - name: Collect Changed Files
        id: changes
        run: |
          echo "### Auto Categorized Changes" > changes.md
          echo "" >> changes.md
          git fetch origin ${{ env.BASE_BRANCH }} --depth=1
          git diff --name-only origin/${{ env.BASE_BRANCH }}...HEAD | while read file; do
            if [[ $file == *.py ]]; then
              echo "- 🐍 Python: $file" >> changes.md
            elif [[ $file == *.js ]]; then
              echo "- 📜 JavaScript: $file" >> changes.md
            elif [[ $file == *.yml || $file == *.yaml ]]; then
              echo "- ⚙️ Config: $file" >> changes.md
            else
              echo "- 📂 Other: $file" >> changes.md
            fi
          done
          cat changes.md >> $GITHUB_STEP_SUMMARY

      - name: Create or Update Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
          base: ${{ env.BASE_BRANCH }}
          title: ${{ env.PR_TITLE }}
          body: |
            ## Description
            <!-- What does this PR change? Why? -->

            ## Auto Categorized Changes
            $(cat changes.md)
          draft: false

